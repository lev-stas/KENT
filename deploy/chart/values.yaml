replicaCount: 1

image:
  repository: staslevchenko/kent
  tag: "0.4.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

serviceAccount:
  name: kent-exporter

rbac:
  create: true

config:
  logger:
    level: info

  kubernetes:
    include_namespaces: []
    exclude_namespaces: []
    # Every filter below is optional; an empty one imposes no restriction.
    # Export only these event types (Normal, Warning); case-insensitive.
    include_event_types: []
    # Export only events about these involved-object kinds (Pod, Node, ...);
    # case-insensitive.
    include_kinds: []
    # RE2 patterns matched against event.reason. They are unanchored, so
    # "^(Failed|BackOff)" also keeps FailedMount and BackOffPullImage — anchor
    # both ends with ^...$ when you mean an exact set. Go's regexp has no
    # negative lookahead, hence both keys: include_reasons keeps only what it
    # matches, exclude_reasons: "^(Pulled|Created|Started)$" drops routine
    # noise. An event must pass include and must not match exclude.
    include_reasons: ""
    exclude_reasons: ""

  victorialogs:
    enabled: true
    endpoint: "http://vlogs.domain.com:9428"
    clusterID: "k8s-prod"
    accountID: "10"
    projectID: "10"
    batchSize: 500
    flushTime: "30s"
    timeout: "10s"
    queueSize: 5000
    extraFields: {}
    streamFields: ["k8s.namespace"]
    # Extra HTTP headers added to every insert request.
    headers: {}
    auth:
      basicUsername: ""
      # Prefer passing the password via a Secret and extraEnv (VL_AUTH_BASIC_PASSWORD)
      # instead of keeping it in values: values land in a ConfigMap.
      basicPassword: ""
      bearerToken: ""
    tls:
      insecureSkipVerify: false
      # Files must be mounted into the pod, see extraVolumes/extraVolumeMounts.
      caFile: ""
      certFile: ""
      keyFile: ""
      serverName: ""

  stdout:
    enabled: false

  health:
    port: 8080

# Scraping of the /metrics endpoint. The chart always creates a ClusterIP Service;
# the ServiceMonitor is optional, since its CRD is not present in every cluster.
serviceMonitor:
  # Requires the Prometheus Operator CRD (monitoring.coreos.com/v1). The
  # VictoriaMetrics operator converts these objects as well.
  enabled: false
  interval: 60s
  scrapeTimeout: 58s
  # Some setups select ServiceMonitors by label — kube-prometheus-stack, for
  # example, matches its own release: {release: kube-prometheus-stack}.
  additionalLabels: {}

extraEnv: []

# Annotations for the exporter pod.
podAnnotations: {}

# Extra volumes/mounts, e.g. for TLS certificates referenced in config.
extraVolumes: []
extraVolumeMounts: []
